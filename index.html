<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Chess Clock">
<meta name="description" content="FIDE標準の持ち時間に対応したチェスクロック。休憩ポーズ付き。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-512.png" sizes="512x512" type="image/png">
<title>Chess Clock</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:manipulation}
/* 横向きのノッチ／ホームインジケータを避ける。縦向きでは最小値が効く */
#app{display:flex;flex-direction:column;height:100dvh;
  padding-top:max(6px,env(safe-area-inset-top));
  padding-bottom:max(4px,env(safe-area-inset-bottom));
  padding-left:max(12px,env(safe-area-inset-left));
  padding-right:max(12px,env(safe-area-inset-right))}

/* ── 筐体 — 天板・液晶・ボタンをひと続きの黒いボディにまとめる ── */
#device{margin:auto 0;padding:10px;
  background:linear-gradient(#15181c,#05070a);border-radius:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.75)}

/* ── 天板のロッカー（シーソー） ───────────
   実物と同じく、浮いている側＝いま時計が動いている側。押されて
   沈んだ側はフラットのまま、動いている側だけが中央の合わせ目を
   支点に外側の端へ向かって持ち上がる。
   下には決して沈まないので液晶部分に重なることがない。 */
#deck{height:83px;padding:21px 8px 10px;margin-bottom:9px;
  border-radius:13px;background:linear-gradient(#090b0d,#171b20);
  box-shadow:inset 0 2px 7px rgba(0,0,0,.85)}
#rocker{height:100%;display:flex}
/* 下端から5pxを濃くして側面の厚みに見せる。px指定なので背が高くなっても厚みは一定 */
.half{flex:1;min-width:0;cursor:pointer;
  background:linear-gradient(to top,
    #9aa0a8 0,#b8bec6 5px,#e2e6ea 6px,#f5f7f9 16px,#fff 100%);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
  clip-path:polygon(0 0,100% 0,100% 100%,0 100%);
  transition:margin-top .18s cubic-bezier(.34,1.15,.5,1),
             clip-path .18s cubic-bezier(.34,1.15,.5,1),
             filter .18s ease}
.half:first-child{border-radius:12px 2px 2px 8px;border-right:1px solid rgba(0,0,0,.05)}
.half:last-child{border-radius:2px 12px 8px 2px}
/* 浮く側は上に伸ばして天面だけを斜めに切る。下端は押された側と揃ったまま、
   合わせ目から外側へ向かって厚みが増す楔形になる。影も強めて高さを強調 */
#rocker.upL .half:first-child{margin-top:-18px;
  clip-path:polygon(0 0,100% 18px,100% 100%,0 100%);
  filter:drop-shadow(0 6px 9px rgba(0,0,0,.62))}
#rocker.upR .half:last-child{margin-top:-18px;
  clip-path:polygon(0 18px,100% 0,100% 100%,0 100%);
  filter:drop-shadow(0 6px 9px rgba(0,0,0,.62))}

/* 桁の高さに合わせて液晶面の高さを決める＝上下に無駄な余白を作らない */
#panel{width:100%;aspect-ratio:7.4;margin-bottom:15px;
  position:relative;overflow:hidden;display:flex;align-items:stretch;
  border-radius:6px;padding:4px 8px;
  background:linear-gradient(168deg,#cfd2ce 0%,#c1c5c1 46%,#b3b7b3 100%);
  box-shadow:inset 0 3px 11px rgba(22,26,22,.42),inset 0 0 0 1px rgba(0,0,0,.4)}
/* ガラス面のわずかな映り込み */
#panel::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(104deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.04) 36%,rgba(255,255,255,0) 58%)}

/* 液晶は表示専用。手番の切り替えは天板のロッカーだけが受け付ける */
.pane{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  opacity:.4;transition:opacity .15s ease}
.pane.pre{opacity:.6}
.pane.run{opacity:1}
#mid{flex:0 0 13%;min-width:34px;display:flex;align-items:center;justify-content:center;opacity:.9}
.pane svg,#mid svg{width:100%;height:100%;display:block}

/* ── セグメント ─────────────────────────── */
.seg{fill:#181b18}
.seg.off{opacity:.095}
.pane.low .seg{fill:#8a1d12}
.pane.flag .seg{fill:#a81414}
.pane.run .colon{animation:blink 1s step-end infinite}
.pane.flag{animation:flash 1.1s step-end infinite}
@keyframes blink{50%{opacity:.08}}
@keyframes flash{50%{opacity:.35}}

/* ── 状態表示と操作バー ─────────────────── */
#bar{display:flex;align-items:center;justify-content:space-evenly;
  width:100%;max-width:400px;margin:0 auto;padding-bottom:3px}
/* 液晶下のボタンも天板のプランジャーと同じ押し心地の見た目にする */
.btn{border:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:44px;padding:0 18px;border-radius:9px;
  font-size:15px;font-weight:700;color:#1b2027;letter-spacing:.02em;
  background:linear-gradient(#fff 0%,#f3f5f7 55%,#dcdfe3 100%);
  box-shadow:0 4px 0 #a7adb4,0 6px 10px rgba(0,0,0,.5),inset 0 1px 0 #fff;
  transform:translateY(-2px);
  transition:transform .1s cubic-bezier(.4,0,.2,1),box-shadow .1s ease}
.btn:active{transform:translateY(2px);
  background:linear-gradient(#e9ecee,#d3d7db);
  box-shadow:0 1px 0 #a7adb4,0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7)}
.btn.icon{width:64px;padding:0;font-size:17px}
/* 実機の ▶/II 刻印。印刷なので状態によらず濃さは一定 */
.btn.key{width:64px;padding:0;font-size:13px;gap:0;letter-spacing:.04em}
#hint{display:none;flex:none;text-align:center;font-size:10px;color:#39424e;padding:8px 0 4px}
@media (orientation:portrait){#hint{display:block}}

/* ── オーバーレイ ───────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:26px;
  padding-top:calc(26px + env(safe-area-inset-top));padding-bottom:calc(26px + env(safe-area-inset-bottom));
  padding-left:calc(20px + env(safe-area-inset-left));padding-right:calc(20px + env(safe-area-inset-right))}
.overlay.show{display:flex}

/* 設定画面も本体と同じ質感で — 黒い筐体の上に液晶のセルが並ぶ */
#setOv{justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(#15181c,#05070a)}
#setOv h2{font-size:16px;font-weight:700;letter-spacing:.05em;color:#e7ecf3;
  margin:0 0 4px;align-self:flex-start}
#setOv .hint{font-size:12px;color:#7c8794;margin:0 0 16px;align-self:flex-start;line-height:1.6}

#presets{width:100%;max-width:440px;display:flex;flex-direction:column}
/* 筐体へのシルク印刷のような見出し */
.grp{width:100%;max-width:440px;font-size:10px;font-weight:700;letter-spacing:.2em;
  color:#79838f;margin:16px 0 6px;padding-left:2px}
.grp:first-child{margin-top:0}

/* 選択肢そのものを液晶のセルに見立てる */
.opt{width:100%;max-width:440px;position:relative;cursor:pointer;
  display:flex;flex-direction:column;justify-content:center;gap:2px;
  min-height:62px;
  padding:11px 36px 11px 14px;margin-bottom:7px;border-radius:5px;
  background:linear-gradient(168deg,#c4c8c4 0%,#b7bbb7 46%,#abafab 100%);
  box-shadow:inset 0 2px 6px rgba(22,26,22,.34),inset 0 0 0 1px rgba(0,0,0,.42);
  transition:background .12s ease}
/* 折り返しを許すと言語によって行数が変わりセルの高さが揃わない */
.opt .t,.opt .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .t{font-size:15px;font-weight:700;color:#141813}
.opt .d{font-size:12px;color:#4e564e}
/* 実機の basic / bonus / delay と同じ、選択位置を示すドット */
.opt::after{content:'';position:absolute;right:13px;top:50%;margin-top:-5px;
  width:10px;height:10px;border-radius:50%;background:#141813;opacity:.11;
  transition:opacity .12s ease}
.opt.sel{background:linear-gradient(168deg,#dde3d6 0%,#d0d7c8 46%,#c4ccbb 100%)}
.opt.sel::after{opacity:1}

#customBox{width:100%;max-width:440px;display:none;gap:7px;flex-direction:column;margin:1px 0 10px}
#customBox.show{display:flex}
.row{display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(#090b0d,#171b20);border-radius:9px;padding:9px 13px;
  font-size:14px;color:#aab3bd;box-shadow:inset 0 2px 6px rgba(0,0,0,.8)}
.row input{width:88px;border:none;border-radius:4px;padding:7px 10px;
  font-size:16px;font-weight:700;text-align:right;font-family:inherit;color:#141813;
  background:linear-gradient(168deg,#c4c8c4,#b0b4b0);
  box-shadow:inset 0 2px 5px rgba(22,26,22,.42),inset 0 0 0 1px rgba(0,0,0,.4)}
#setOv .actions{width:100%;max-width:440px;display:flex;gap:10px;margin-top:14px;padding-bottom:20px}
/* キャンセルと適用は同じ幅で並べる */
#setOv .actions .btn{flex:1 1 0;min-width:0;height:50px;padding:0 10px}
.toggle{width:100%;max-width:440px;margin-bottom:7px}

/* ホバーはマウス環境だけ。タップ後に状態が残らないよう pointer:fine に限定する */
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-4px);
    box-shadow:0 6px 0 #a7adb4,0 9px 14px rgba(0,0,0,.55),inset 0 1px 0 #fff}
  /* :hover の後に再宣言して、押下中は必ず沈むようにする */
  .btn:active{transform:translateY(2px);
    box-shadow:0 1px 0 #a7adb4,0 2px 4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7)}
  .opt:hover{background:linear-gradient(168deg,#d2d6d2 0%,#c5c9c5 46%,#b9bdb9 100%)}
  .opt:hover::after{opacity:.32}
  .opt.sel:hover{background:linear-gradient(168deg,#e7ede0 0%,#dae1d2 46%,#ced6c5 100%)}
  .opt.sel:hover::after{opacity:1}
  .row input:hover,.row input:focus{outline:none;
    background:linear-gradient(168deg,#d2d6d2,#bec2be)}
}
</style>
</head>
<body>
<div id="app">
  <div id="device">
    <div id="deck">
      <div id="rocker">
        <div class="half" id="pl0"></div>
        <div class="half" id="pl1"></div>
      </div>
    </div>

    <div id="panel">
      <div class="pane pre" id="p0"></div>
      <div id="mid"></div>
      <div class="pane pre" id="p1"></div>
    </div>

    <div id="bar">
      <button class="btn icon" id="btnSet">&#9881;&#65038;</button>
      <button class="btn key" id="btnPause">&#9654;&#65038;/II</button>
      <button class="btn icon" id="btnReset">↺</button>
    </div>
  </div>

  <div id="hint" data-i18n="hintRotate">横向きにすると大きく表示されます</div>
</div>

<div class="overlay" id="setOv">
  <h2 data-i18n="setTitle">持ち時間の設定</h2>
  <p class="hint" data-i18n="setHint">変更すると対局はリセットされます</p>
  <div id="presets"></div>
  <div id="customBox">
    <div class="row"><span data-i18n="cBase">初期持ち時間（分）</span><input type="number" id="cBase" inputmode="numeric" min="1" max="600"></div>
    <div class="row"><span data-i18n="cInc">1手ごとの加算（秒）</span><input type="number" id="cInc" inputmode="numeric" min="0" max="180"></div>
    <div class="row"><span data-i18n="cMoves">第1期間の手数（0＝なし）</span><input type="number" id="cMoves" inputmode="numeric" min="0" max="200"></div>
    <div class="row"><span data-i18n="cAdd">通過後の追加（分）</span><input type="number" id="cAdd" inputmode="numeric" min="0" max="600"></div>
  </div>
  <div class="grp" data-i18n="options">オプション</div>
  <div class="opt toggle" id="soundOpt">
    <div class="t"><span data-i18n="sound">効果音</span> <span id="soundState">ON</span></div>
    <div class="d" data-i18n="soundD">着手時のクリック音と時間切れ音</div>
  </div>

  <div class="grp" data-i18n="lang">言語</div>
  <div class="opt toggle" id="langJa"><div class="t">日本語</div></div>
  <div class="opt toggle" id="langEn"><div class="t">English</div></div>
  <div class="actions">
    <button class="btn" id="btnCancel" data-i18n="cancel">キャンセル</button>
    <button class="btn" id="btnApply" data-i18n="apply">適用してリセット</button>
  </div>
</div>

<script>
/* ═══ 7セグメント液晶 ══════════════════════════════════
   外部フォントを使わず、セグメント多角形をSVGで直接描く。
   消灯セグメントを薄く残すことで実機の液晶らしくなる。 */
const DW=60, DH=104, T=13, PAD=3, GAP=2.2, ADV=DW+6;
const yT=PAD+T/2, yM=DH/2, yB=DH-PAD-T/2, xL=PAD+T/2, xR=DW-PAD-T/2;
function hseg(y,x1,x2){const t=T/2;x1+=GAP;x2-=GAP;
  return `${x1},${y} ${x1+t},${y-t} ${x2-t},${y-t} ${x2},${y} ${x2-t},${y+t} ${x1+t},${y+t}`}
function vseg(x,y1,y2){const t=T/2;y1+=GAP;y2-=GAP;
  return `${x},${y1} ${x+t},${y1+t} ${x+t},${y2-t} ${x},${y2} ${x-t},${y2-t} ${x-t},${y1+t}`}
const PTS={a:hseg(yT,xL,xR), g:hseg(yM,xL,xR), d:hseg(yB,xL,xR),
           f:vseg(xL,yT,yM), b:vseg(xR,yT,yM), e:vseg(xL,yM,yB), c:vseg(xR,yM,yB)};
const SEG={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fbgc','5':'afgcd',
           '6':'afgecd','7':'abc','8':'abcdefg','9':'abfgcd',' ':''};

// 文字列を1行ぶんのセグメント markup にする（' ' は全消灯の桁）
function runDigits(str){
  let x=0, parts=[];
  for(const ch of str){
    if(ch===':'){
      parts.push(`<circle class="seg colon" cx="${x+11}" cy="${DH*.33}" r="6.5"/>`
               + `<circle class="seg colon" cx="${x+11}" cy="${DH*.70}" r="6.5"/>`);
      x+=23;
    }else if(ch==='.'){
      parts.push(`<circle class="seg" cx="${x+9}" cy="${yB}" r="6.5"/>`); x+=19;
    }else{
      const on=SEG[ch]||'';
      let g='';
      for(const k of 'abcdefg') g+=`<polygon class="seg${on.includes(k)?'':' off'}" points="${PTS[k]}"/>`;
      parts.push(`<g transform="translate(${x},0)">${g}</g>`);
      x+=ADV;
    }
  }
  return {m:parts.join(''), w:Math.max(0,x-6)};
}

const SS=0.44;          // 小さい桁の縮尺
const COLGAP=13;        // 大きい桁と小桁カラムの間隔

/* 片側の表示： [ 時:分 ]  +  右に上下2段（上=手数カウント / 下=秒） */
function sideSvg(big, mv, sec){
  const B=runDigits(big), M=runDigits(mv), S=runDigits(sec);
  const colW=Math.max(M.w,S.w)*SS;
  const W=B.w+COLGAP+colW;
  const mx=B.w+COLGAP+(colW-M.w*SS);      // 右揃え
  const sx=B.w+COLGAP+(colW-S.w*SS);
  return `<svg viewBox="0 0 ${W} ${DH}" preserveAspectRatio="xMidYMid meet">`
       + B.m
       + `<g transform="translate(${mx},0) scale(${SS})">${M.m}</g>`
       + `<g transform="translate(${sx},${DH-DH*SS}) scale(${SS})">${S.m}</g>`
       + `</svg>`;
}

/* 中央： 上=1手あたりの加算秒数 / 下=手番を指す三角（dir=0 は未開始で非表示） */
function midSvg(inc, dir){
  const I=runDigits(inc);
  const W=Math.max(I.w*SS, 44);
  const ix=(W-I.w*SS)/2;
  const aw=24, ah=28, ay=DH-ah-6, ax=(W-aw)/2;
  let tri='';
  if(dir<0) tri=`${ax+aw},${ay} ${ax+aw},${ay+ah} ${ax},${ay+ah/2}`;
  else if(dir>0) tri=`${ax},${ay} ${ax},${ay+ah} ${ax+aw},${ay+ah/2}`;
  return `<svg viewBox="0 0 ${W} ${DH}" preserveAspectRatio="xMidYMid meet">`
       + `<g transform="translate(${ix},2) scale(${SS})">${I.m}</g>`
       + (tri ? `<polygon class="seg" points="${tri}"/>` : '')
       + `</svg>`;
}

const p2=n=>String(n).padStart(2,'0');
const p3=n=>String(Math.min(999,n)).padStart(3,'0');

/* ═══ 持ち時間プリセット ══════════════════════════════ */
/* ═══ 表示言語 ══════════════════════════════════════ */
const I18N={
 ja:{
  hintRotate:'横向きにすると大きく表示されます',
  setTitle:'持ち時間の設定', setHint:'変更すると対局はリセットされます',
  cBase:'初期持ち時間（分）', cInc:'1手ごとの加算（秒）',
  cMoves:'第1期間の手数（0＝なし）', cAdd:'通過後の追加（分）',
  options:'オプション',
  sound:'効果音', soundD:'着手時のクリック音と時間切れ音',
  lang:'言語',
  cancel:'キャンセル', apply:'適用してリセット',
  confirmReset:'対局をリセットしますか？',
  bullet:'バレット', blitz:'ブリッツ', rapid:'ラピッド', classical:'クラシカル', other:'その他'
 },
 en:{
  hintRotate:'Rotate to landscape for a larger display',
  setTitle:'Time control', setHint:'Changing this resets the game',
  cBase:'Base time (min)', cInc:'Increment (sec)',
  cMoves:'Moves in period 1 (0 = none)', cAdd:'Added after period 1 (min)',
  options:'OPTIONS',
  sound:'Sound', soundD:'Click on each move, tone on flag fall',
  lang:'LANGUAGE',
  cancel:'Cancel', apply:'Apply and reset',
  confirmReset:'Reset the game?',
  bullet:'BULLET', blitz:'BLITZ', rapid:'RAPID', classical:'CLASSICAL', other:'OTHER'
 }
};
function lang(){ return cfg && cfg.lang==='en' ? 'en' : 'ja'; }
function t(k){ return I18N[lang()][k] || k; }
function L(o){ return typeof o==='string' ? o : (o[lang()] || o.ja); }

/* 並びは chess.com の対局作成画面に合わせる（バレット／ブリッツ／ラピッド各3種） */
const PRESETS = [
  {id:'b1',   g:'bullet', t:{ja:'1分',en:'1 min'},   d:{ja:'1分 切れ負け',en:'1 min, no increment'},  inc:0, stages:[{moves:0,base:60}]},
  {id:'b11',  g:'bullet', t:{ja:'1 | 1',en:'1 | 1'}, d:{ja:'1分 + 1秒加算',en:'1 min, +1 sec'},       inc:1, stages:[{moves:0,base:60}]},
  {id:'b21',  g:'bullet', t:{ja:'2 | 1',en:'2 | 1'}, d:{ja:'2分 + 1秒加算',en:'2 min, +1 sec'},       inc:1, stages:[{moves:0,base:120}]},

  {id:'z3',   g:'blitz',  t:{ja:'3分',en:'3 min'},   d:{ja:'3分 切れ負け（オンライン最多）',en:'3 min (most played online)'}, inc:0, stages:[{moves:0,base:180}]},
  {id:'z32',  g:'blitz',  t:{ja:'3 | 2',en:'3 | 2'}, d:{ja:'3分 + 2秒加算（FIDE公式）',en:'3 min, +2 sec (FIDE blitz)'},                    inc:2, stages:[{moves:0,base:180}]},
  {id:'z5',   g:'blitz',  t:{ja:'5分',en:'5 min'},   d:{ja:'5分 切れ負け（対面の定番）',en:'5 min (club standard)'},          inc:0, stages:[{moves:0,base:300}]},

  {id:'r10',  g:'rapid',  t:{ja:'10分',en:'10 min'},   d:{ja:'10分 切れ負け',en:'10 min, no increment'},                  inc:0,  stages:[{moves:0,base:600}]},
  {id:'r1510',g:'rapid',  t:{ja:'15 | 10',en:'15 | 10'},d:{ja:'15分 + 10秒加算（FIDE公式）',en:'15 min, +10 sec (FIDE rapid)'}, inc:10, stages:[{moves:0,base:900}]},
  {id:'r30',  g:'rapid',  t:{ja:'30分',en:'30 min'},   d:{ja:'30分 切れ負け',en:'30 min, no increment'},                  inc:0,  stages:[{moves:0,base:1800}]},

  {id:'fide', g:'classical', t:{ja:'90 | 30 ・40手',en:'90 | 30 · 40 moves'},
              d:{ja:'90分/40手 + 30分 + 30秒加算（FIDE標準）',en:'90/40 + 30 min, +30 sec (FIDE standard)'},
              inc:30, stages:[{moves:40,base:5400},{moves:0,base:1800}]},
  {id:'wcc',  g:'classical', t:{ja:'120 | 30 ・40手',en:'120 | 30 · 40 moves'},
              d:{ja:'120分/40手 + 30分 + 30秒加算',en:'120/40 + 30 min, +30 sec'},
              inc:30, stages:[{moves:40,base:7200},{moves:0,base:1800}]},
  {id:'single',g:'classical',t:{ja:'90 | 30',en:'90 | 30'}, d:{ja:'90分 + 30秒加算',en:'90 min, +30 sec'}, inc:30, stages:[{moves:0,base:5400}]},

  {id:'custom',g:'other', t:{ja:'カスタム',en:'Custom'}, d:{ja:'自分で設定する',en:'Set your own'}, custom:true}
];
// 既定は 15|10。物理クロックはボタンを押す時間も持ち時間から引かれるので、
// chess.com 既定の 10分（加算なし）より加算ありの方が実情に合う。
const DEFAULT_ID='r1510';
const LS='chessclock.v5';
let cfg = load();

function load(){
  try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.tc) return s; }catch(e){}
  const d=PRESETS.find(p=>p.id===DEFAULT_ID);
  return {sel:d.id, tc:{inc:d.inc, stages:d.stages}, sound:true,
          custom:{base:15,inc:10,moves:0,add:0}};
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(cfg)); }catch(e){} }

/* ═══ 対局状態 ══════════════════════════════════════ */
let P, active, started, over, paused, t0, ms0, midSig='';
// 沈んでいる側＝止まっている側。対局前は「先手ではない方」を沈めておく
let pressed = 1;

function reset(){
  const tc=cfg.tc;
  P=[0,1].map(()=>({ms: tc.stages[0].base*1000, moves:0, stage:0, inStage:0, flag:false, sig:''}));
  active=null; started=false; over=false; paused=false;
  pressed=1;                       // 既定は右が沈む＝左（先手）が浮いた状態
  midSig='';
  render();
}

function remaining(i){
  if(active===i && started && !paused && !over) return Math.max(0, ms0-(performance.now()-t0));
  return P[i].ms;
}
function commit(){ if(active!==null) P[active].ms=remaining(active); }

function setActive(i){
  P[i].ms=remaining(i);
  active=i; started=true;
  ms0=P[i].ms; t0=performance.now();
  wake();
}

function onMove(i){
  const p=P[i], tc=cfg.tc;
  p.ms += tc.inc*1000;
  p.moves++;
  const st=tc.stages[p.stage];
  if(st && st.moves>0){
    p.inStage++;
    if(p.inStage>=st.moves){
      p.stage++; p.inStage=0;
      const nx=tc.stages[p.stage];
      if(nx) p.ms += nx.base*1000;
    }
  }
}

function tap(i){
  if(over||paused) return;
  beep(660,.04);
  // 対局前はロッカーが「どちらから開始するか」の選択スイッチ。何度でも切り替えられる
  if(!started){ pressed=i; render(); return; }
  // 実物と同じく「自分側を押す＝自分が沈んで止まり、相手が浮いて動き出す」
  if(active!==i) return;
  commit();
  onMove(i);
  pressed=i;
  setActive(1-i);
}

// ▶ で対局開始。浮いている側の時計から動き出す
function start(){
  if(started||over) return;
  setActive(1-pressed);
}

function pause(){
  if(!started||over||paused) return;
  commit(); paused=true;
  render();
}
function resume(){
  if(!paused) return;
  paused=false;
  if(active!==null){ ms0=P[active].ms; t0=performance.now(); }
  wake();
}

/* ═══ 描画 ══════════════════════════════════════════ */
// 1時間以上: 大[ H:MM] 小[SS] ／ 1時間未満: 大[MM:SS] 小[空、残り1分未満は .D]
function strings(i){
  const r=remaining(i), p=P[i];
  const ts=Math.floor(r/100), s=Math.floor(ts/10);
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
  const big = h>0 ? ' '+h+':'+p2(m) : p2(m)+':'+p2(ss);
  const sec = h>0 ? p2(ss) : (r<60000 ? '.'+(ts%10) : '  ');
  return {big, mv:p3(p.moves), sec};
}

function render(){
  const panes=[document.getElementById('p0'),document.getElementById('p1')];
  // 浮いている側＝いま動いている側（対局前は「これから動く側」）で一貫させる
  const up = 1-pressed;
  const rocker=document.getElementById('rocker');
  rocker.classList.toggle('upL', up===0);
  rocker.classList.toggle('upR', up===1);

  for(let i=0;i<2;i++){
    const r=remaining(i), p=P[i], el=panes[i];
    const st=strings(i), sig=st.big+'|'+st.mv+'|'+st.sec;
    if(sig!==p.sig){ p.sig=sig; el.innerHTML=sideSvg(st.big, st.mv, st.sec); }
    el.classList.toggle('pre', !started && !over);
    el.classList.toggle('run', active===i && !paused && !over);
    el.classList.toggle('low', r<60000 && !p.flag);
    el.classList.toggle('flag', p.flag);
  }
  // 中央：加算秒数と、動作中の側を指す矢印（対局開始まで矢印は出さない）
  const dir = active===null ? 0 : (active===0 ? -1 : 1);
  const inc=p2(Math.min(99,cfg.tc.inc));
  const ms=inc+'|'+dir;
  if(ms!==midSig){ midSig=ms; document.getElementById('mid').innerHTML=midSvg(inc, dir); }

  document.getElementById('btnPause').style.opacity = over ? .4 : 1;
}

function tick(){
  if(started&&!paused&&!over&&active!==null&&remaining(active)<=0){
    P[active].ms=0; P[active].flag=true; over=true;
    beep(180,.6);
  }
  render();
  requestAnimationFrame(tick);
}

/* ═══ 効果音 / スリープ防止 ══════════════════════════ */
let ac=null;
function beep(f,d){
  if(!cfg.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.18,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.start(); o.stop(ac.currentTime+d);
  }catch(e){}
}
let wl=null;
async function wake(){
  try{ if('wakeLock' in navigator && !wl) wl=await navigator.wakeLock.request('screen'); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ wl=null; if(started&&!paused&&!over) wake(); });

/* ═══ 設定画面 ══════════════════════════════════════ */
function buildPresets(){
  const box=document.getElementById('presets'); box.innerHTML='';
  let group=null;
  PRESETS.forEach(p=>{
    if(p.g!==group){
      group=p.g;
      const h=document.createElement('div');
      h.className='grp'; h.textContent=t(group);
      box.appendChild(h);
    }
    const d=document.createElement('div');
    d.className='opt'+(cfg.sel===p.id?' sel':'');
    d.innerHTML='<div class="t">'+L(p.t)+'</div><div class="d">'+L(p.d)+'</div>';
    d.onclick=()=>{ cfg.sel=p.id; buildPresets(); document.getElementById('customBox').classList.toggle('show',!!p.custom); };
    box.appendChild(d);
  });
  document.getElementById('customBox').classList.toggle('show', cfg.sel==='custom');
}
function openSet(){
  buildPresets();
  const c=cfg.custom;
  cBase.value=c.base; cInc.value=c.inc; cMoves.value=c.moves; cAdd.value=c.add;
  syncSound();
  document.getElementById('setOv').classList.add('show');
}
function applySet(){
  if(cfg.sel==='custom'){
    const base=Math.max(1,+cBase.value||90), inc=Math.max(0,+cInc.value||0),
          mv=Math.max(0,+cMoves.value||0), add=Math.max(0,+cAdd.value||0);
    cfg.custom={base,inc,moves:mv,add};
    const stages=[{moves:mv,base:base*60}];
    if(mv>0) stages.push({moves:0,base:add*60});
    cfg.tc={inc,stages};
  }else{
    const p=PRESETS.find(x=>x.id===cfg.sel);
    cfg.tc={inc:p.inc,stages:p.stages};
  }
  save();
  document.getElementById('setOv').classList.remove('show');
  reset();
}

/* ═══ 入力 ══════════════════════════════════════════ */
// 手番の切り替えは天板のロッカーのみ。液晶に触れても動かない（誤操作防止）
for(const [id,i] of [['pl0',0],['pl1',1]]){
  document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();tap(i);});
}
document.getElementById('btnPause').onclick=()=>{
  if(!started) start(); else if(paused) resume(); else pause();
};
document.getElementById('btnSet').onclick=openSet;
document.getElementById('btnCancel').onclick=()=>document.getElementById('setOv').classList.remove('show');
document.getElementById('btnApply').onclick=applySet;
document.getElementById('btnReset').onclick=()=>{ if(!started || confirm(t('confirmReset'))) reset(); };
// 表示言語を画面全体に反映する。data-i18n を持つ要素は textContent を差し替え、
// 記号つきのボタンなど組み立てが要るものはここで個別に組む。
function applyLang(){
  document.documentElement.lang = lang();
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.getElementById('langJa').classList.toggle('sel', lang()==='ja');
  document.getElementById('langEn').classList.toggle('sel', lang()==='en');
  buildPresets();
  render();
}
function setLang(v){ cfg.lang=v; save(); applyLang(); }
document.getElementById('langJa').onclick=()=>setLang('ja');
document.getElementById('langEn').onclick=()=>setLang('en');

// ON のときだけドットを点灯させる（プリセットの選択表示と同じ作法）
function syncSound(){
  document.getElementById('soundState').textContent=cfg.sound?'ON':'OFF';
  document.getElementById('soundOpt').classList.toggle('sel', cfg.sound);
}
document.getElementById('soundOpt').onclick=()=>{
  cfg.sound=!cfg.sound; save(); syncSound();
};
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

reset(); applyLang(); tick();

/* ═══ オフライン対応 ════════════════════════════════ */
if('serviceWorker' in navigator && location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
